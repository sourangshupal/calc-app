<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <article class="calc" aria-label="Calculator">
        <header class="calc-top">
          <div>
            <p class="eyebrow">FastAPI</p>
            <h1>Calculator</h1>
          </div>
          <div class="health" id="health" data-status="checking" title="API health">
            <span class="health-dot" aria-hidden="true"></span>
            <span class="health-label" id="health-label">Checking</span>
          </div>
        </header>

        <section class="display" aria-live="polite">
          <div class="display-meta">
            <p class="expression" id="expression">&nbsp;</p>
            <span class="m-flag" id="m-flag" hidden>M</span>
          </div>
          <p class="value" id="display">0</p>
        </section>

        <div class="pad" id="pad">
          <button type="button" class="key key-mem" data-action="memory-clear" aria-label="Memory clear">
            MC
          </button>
          <button type="button" class="key key-mem" data-action="memory-recall" aria-label="Memory recall">
            MR
          </button>
          <button type="button" class="key key-mem" data-action="memory-plus" aria-label="Memory plus">
            M+
          </button>
          <button type="button" class="key key-mem" data-action="memory-minus" aria-label="Memory minus">
            M−
          </button>

          <button type="button" class="key key-muted" data-action="clear" aria-label="Clear">
            C
          </button>
          <button type="button" class="key key-muted" data-action="backspace" aria-label="Backspace">
            ⌫
          </button>
          <button type="button" class="key key-muted" data-action="sqrt" aria-label="Square root">
            √
          </button>
          <button type="button" class="key key-op" data-op="/" aria-label="Divide">÷</button>

          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key key-op" data-op="*" aria-label="Multiply">×</button>

          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key key-op" data-op="-" aria-label="Subtract">−</button>

          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key key-op" data-op="+" aria-label="Add">+</button>

          <button type="button" class="key key-zero" data-digit="0">0</button>
          <button type="button" class="key" data-action="decimal" aria-label="Decimal point">
            .
          </button>
          <button type="button" class="key key-eq" data-action="equals" aria-label="Equals">
            =
          </button>
        </div>
      </article>

      <aside class="tape" aria-label="Calculation history">
        <header class="tape-top">
          <h2>History</h2>
          <button type="button" class="tape-clear" id="history-clear">Clear tape</button>
        </header>
        <ol class="tape-list" id="history"></ol>
        <p class="tape-empty" id="history-empty">No calculations yet.</p>
      </aside>
    </main>
    <script src="/static/memory_ui.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
